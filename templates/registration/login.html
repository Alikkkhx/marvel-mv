{% extends 'base.html' %}

{% block title %}Login | Marvel Tracker Pro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="glass p-10 rounded-2xl border border-white/10">
        <h2 class="text-3xl font-black mb-8 text-center uppercase tracking-tighter">Sign In</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="space-y-6">
                {% for field in form %}
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2">{{ field.label }}</label>
                    <input 
                        type="{{ field.field.widget.input_type }}" 
                        name="{{ field.name }}"
                        class="w-full bg-zinc-800 border border-transparent focus:border-red-600 rounded p-3 outline-none transition-all"
                        required
                    >
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
                
                <button type="submit" class="w-full bg-red-600 py-3 rounded font-bold hover:bg-red-700 transition-colors mt-4">
                    Sign In
                </button>
            </div>
        </form>
        
        <div class="mt-8 text-center text-gray-500 text-sm">
            New to Marvel Tracker? <a href="{% url 'register' %}" class="text-white hover:underline">Sign up now</a>.
        </div>
    </div>
</div>
{% endblock %}
