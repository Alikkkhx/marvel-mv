# Render Blueprint — https://render.com/docs/blueprint-spec
# Подключи репо в Render → New → Blueprint → выбрать ветку с этим файлом
# ПЕРЕД первым успешным деплоем в Dashboard добавь (Environment):
#   DATABASE_URL — строка Postgres (например с https://neon.tech, формат postgresql://...)
#   ALLOWED_HOSTS = имя_сервиса.onrender.com
#   CSRF_TRUSTED_ORIGINS = https://имя_сервиса.onrender.com
#   CORS_ALLOWED_ORIGINS = https://имя_сервиса.onrender.com
# После деплоя: Shell →  python manage.py seed_mcu

version: "1"
services:
  - type: web
    name: marvel-mv
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
